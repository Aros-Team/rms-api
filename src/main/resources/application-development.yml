app:
  env: development
  admin:
    dummy-email: ${DUMMY_EMAIL:admin@local.dev}
  storage:
    type: local
    local:
      base-dir: ./uploads
      base-url: http://localhost:8080/api/v1/images/local

spring:
  sql:
    init:
      # Boot must never seed or wipe data. Use ./gradlew seedReset explicitly.
      mode: never
  cloud:
    gcp:
      enabled: false
      storage:
        enabled: false
  datasource:
    # The session, Hibernate and the seed CLI all use the business timezone so
    # TIME/DATETIME wall-clock values read back exactly as stored.
    url: jdbc:mysql://localhost:3306/${DB_NAME:rmsdb}?connectionTimeZone=America/Bogota&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      max-lifetime: 1800000
      connection-test-query: "SELECT 1"
      pool-name: RmsHikariPool
      initialization-fail-timeout: -1


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n"
  level:
    root: WARN
    aros.services.rms: INFO
    aros.services.rms.core.auth.application.service.LoginService: DEBUG
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN
    jakarta.persistence: WARN
    org.flywaydb: ERROR
    aros.services.rms.infraestructure.common.config.RequestLoggingFilter: WARN
    springframework:
      boot:
        autoconfigure:
          flyway: WARN

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
